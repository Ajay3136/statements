<style>
:root{box-sizing:border-box;--bg:#020a1d;--card:#0f1c3d;--card2:#27325a;--blue:#0a74da;--link:#4aa8ff;--mut:#c4c9d8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:#fff;font-family:-apple-system,"SF Pro Text",Inter,Helvetica,Arial,sans-serif}
.phone{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:140px}
.status{position:sticky;top:0;z-index:10;height:54px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 22px 0 21px;font-weight:600;font-size:17px}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;display:flex;align-items:center;justify-content:center}
.rec{width:10px;height:10px;border-radius:50%;background:#ff2d2d;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.sr{display:flex;gap:6px;align-items:center}
.bat{position:relative;width:34px;height:22px;border-radius:7px;background:linear-gradient(90deg,#f5d000 0 38%,#6e6e73 38%);color:#111;font-size:15px;font-weight:700;display:grid;place-items:center;margin-right:4px}.bat::after{content:"";position:absolute;right:-4px;top:7px;width:2px;height:8px;border-radius:0 2px 2px 0;background:#6e6e73}
.back{margin:calc(env(safe-area-inset-top,0px) + 20px) 0 0 16px;width:44px;height:44px;border-radius:50%;background:#0d1a3a;border:1px solid #1d2c55;display:grid;place-items:center}
h1{font-size:30px;font-weight:700;margin:22px 16px 14px}
.bal{margin:0 16px;background:var(--card);border-radius:18px;padding:18px 20px;position:relative}
.bal small{color:var(--mut);font-size:17px}
.bal b{display:block;font-size:34px;margin:4px 0}
.bal span{font-size:17px}
.bal>svg{position:absolute;right:20px;top:50%}
.hd{display:flex;justify-content:space-between;align-items:center;margin:32px 16px 14px}
.hd h2{font-size:19px}.hd a{color:var(--link);font-weight:600;font-size:17px}
.car{display:flex;gap:10px;padding:0 0 0 0;margin-left:-14px}
.peek{flex:0 0 14px;background:var(--card2);border-radius:0 18px 18px 0;opacity:.8}
.peek.r{border-radius:18px 0 0 18px;margin-left:0}
.stmt{flex:1;background:var(--card2);border-radius:26px;padding:26px 24px 24px;min-height:285px;display:flex;flex-direction:column}
.stmt p{font-size:19px;font-weight:500}.stmt .l{color:var(--mut);margin-top:34px;font-weight:400}
.stmt b{font-size:34px;display:block;margin-top:6px}
.pay{margin-top:auto;background:var(--blue);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;font-size:17px;line-height:1.25}
.pay div{flex:1}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0 36px}
.dots i{width:10px;height:10px;border-radius:50%;background:#8a8f9c}.dots i.a{background:var(--link)}
.acts{display:flex;gap:16px;margin:0 16px}
.acts div{flex:1;height:76px;border-radius:26px;background:#0b1a3f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--link);font-weight:600;font-size:16px;text-align:center;line-height:1.15}
.list{margin:30px 16px 0;background:var(--card);border-radius:22px;padding:0 16px}
.row{display:flex;align-items:center;gap:20px;height:84px;font-size:22px}
.row+.row{border-top:1px solid #26335c}
.row span{flex:1}.row .c{color:#9aa}
svg{stroke:var(--link);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
